<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cicletada Embajada de Italia · Validación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#008C45; --verde-osc:#006b35; --blanco:#F4F5F0; --rojo:#CD212A; --rojo-osc:#a5141c;
    --tinta:#1d2b22; --gris:#6b7770;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--blanco);color:var(--tinta);font-family:'Nunito',system-ui,sans-serif}
  .bandera{display:flex;height:8px}
  .bandera i{flex:1}.bandera i:nth-child(1){background:var(--verde)}.bandera i:nth-child(2){background:#fff}.bandera i:nth-child(3){background:var(--rojo)}
  main{max-width:900px;margin:0 auto;padding:16px 14px 40px}
  h1{margin:10px 0 18px;text-align:center;font-weight:900;font-size:clamp(1.6rem,6.5vw,2.6rem);line-height:1.1;color:var(--verde)}
  h1 span{color:var(--rojo)}

  /* Progreso */
  .barra{position:relative;height:38px;border-radius:19px;background:#fff;border:3px solid var(--rojo);overflow:hidden}
  .relleno{position:absolute;inset:0 auto 0 0;width:0;background:var(--verde);transition:width .45s ease}
  .total{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:900;font-size:1.15rem;color:var(--rojo);background:#fff;padding:1px 10px;border-radius:12px}
  .stats{display:flex;justify-content:space-between;gap:10px;margin:10px 2px 18px;font-weight:800;font-size:clamp(.95rem,4vw,1.2rem)}
  .stats .ok{color:var(--verde)} .stats .pend{color:var(--rojo);text-align:right}
  .stats small{font-weight:700;opacity:.85}
  .stats{margin-bottom:6px}
  .sync{text-align:center;font-weight:800;font-size:.85rem;margin:0 0 14px;color:var(--gris)}
  .sync.ok{color:var(--verde)} .sync.off{color:var(--rojo)}

  /* Controles */
  .filtros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .filtros button{padding:13px 4px;border:3px solid transparent;border-radius:14px;font:800 clamp(.88rem,3.8vw,1.05rem) 'Nunito',sans-serif;cursor:pointer;line-height:1.15;opacity:.45;transition:opacity .2s,transform .1s}
  .filtros button.on{opacity:1;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .f-todos{background:#fff;color:var(--tinta);border-color:#cfd3c9 !important}
  .f-todos.on{border-color:var(--tinta) !important}
  .f-pend{background:var(--rojo);color:#fff}
  .f-val{background:var(--verde);color:#fff}
  .filtros small{display:block;font-size:.8em;font-weight:700;opacity:.85;margin-top:2px}
  .sticky{position:sticky;top:0;z-index:5;background:var(--blanco);padding:10px 0 8px;margin-bottom:6px;border-bottom:2px solid #e3e5dd}
  .buscar{position:relative}
  .buscar input{width:100%;padding:14px 44px 14px 16px;border:3px solid var(--verde);border-radius:14px;font:700 1.05rem 'Nunito',sans-serif;color:var(--tinta);background:#fff;outline:none}
  .buscar input:focus{border-color:var(--rojo)}
  .buscar input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  .limpiar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--rojo);color:#fff;font-weight:900;font-size:1rem;cursor:pointer;display:none}
  .letras{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:8px}
  @media (min-width:720px){.letras{grid-template-columns:repeat(27,1fr)}}
  .letras button{padding:7px 0;border:0;border-radius:7px;background:var(--verde);color:#fff;font:800 .9rem 'Nunito',sans-serif;cursor:pointer}
  .letras button:nth-child(3n+2){background:#fff;color:var(--verde);box-shadow:inset 0 0 0 2px var(--verde)}
  .letras button:nth-child(3n){background:var(--rojo)}
  .letras button:disabled{opacity:.22;cursor:default}

  /* Listado */
  .lista{display:flex;flex-direction:column;gap:8px;align-content:start;min-height:100vh;min-height:100dvh}
  .reg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border:0;border-radius:14px;background:var(--rojo);color:#fff;font:800 1.12rem 'Nunito',sans-serif;cursor:pointer;transition:transform .08s,background .25s}
  .reg:active{transform:scale(.985)}
  .reg .ap{text-transform:uppercase;letter-spacing:.02em}
  .reg .det{display:block;font-size:.8rem;font-weight:700;opacity:.85;margin-top:2px}
  .reg .chk{margin-left:auto;font-size:1.3rem;display:none}
  .reg.val{background:var(--verde)}
  .btn-ok.largo{font-size:1.15rem;line-height:1.2;padding:16px 10px}
  .reg.val .chk{display:block}
  .vacio{text-align:center;padding:30px 10px;color:var(--gris);font-weight:800}

  /* Modal */
  .fondo{position:fixed;inset:0;background:rgba(10,20,14,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .fondo.on{display:flex}
  .modal{width:100%;max-width:440px;background:#fff;border-radius:22px;padding:26px 20px 24px;text-align:center;border-top:10px solid var(--verde);border-bottom:10px solid var(--rojo);animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
  .modal p{margin:0;font-weight:800;font-size:1.15rem;color:var(--gris)}
  .modal h2{margin:8px 0 24px;font-weight:900;font-size:clamp(1.5rem,7vw,2rem);color:var(--tinta);line-height:1.15}
  .acciones{position:relative;display:flex;justify-content:center;align-items:center}
  .btn-ok{width:62%;padding:20px 0;border:0;border-radius:18px;background:var(--verde);color:#fff;font:900 1.8rem 'Nunito',sans-serif;cursor:pointer;box-shadow:0 6px 0 var(--verde-osc)}
  .btn-ok:active{transform:translateY(3px);box-shadow:0 3px 0 var(--verde-osc)}
  .btn-x{position:absolute;right:0;width:40px;height:40px;border:0;border-radius:50%;background:var(--rojo);color:#fff;font:900 1.2rem 'Nunito',sans-serif;cursor:pointer;line-height:1}

  footer{text-align:center;color:var(--gris);font-weight:700;font-size:.85rem;margin-top:28px}
</style>
</head>

  <div class="lista" id="lista"></div>

  <footer>CicloRecreoVía · Cicletada Embajada de Italia</footer>
</main>

</div>

    const cb = '_cb' + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    const t = setTimeout(() => fin(new Error('timeout')), 15000);
    function fin(err, data){ clearTimeout(t); delete window[cb]; s.remove(); err ? ko(err) : ok(data); }
    window[cb] = d => fin(null, d);
    s.onerror = () => fin(new Error('red'));
    s.src = API + '?' + new URLSearchParams({...params, callback: cb, _: Date.now()});
    document.head.appendChild(s);
  });
}

function estado(tipo){
  const n = Object.keys(pend).length, el = document.getElementById('sync');
  if (!el) return;
  el.className = 'sync ' + tipo;
  el.textContent = !ONLINE ? '● Modo local (sin planilla)'
    : tipo === 'ok' ? '● Sincronizado con la planilla'
    : tipo === 'off' ? `● Sin conexión${n ? ` · ${n} cambio${n>1?'s':''} pendiente${n>1?'s':''}` : ''}`
    : '● Sincronizando…';
}

let enviando = false;
async function enviar(){
  if (!ONLINE || enviando) return;
  enviando = true; estado('wait');
  try {
    for (const id of Object.keys(pend)) {
      const v = pend[id], r = registros.find(x => x.id === id);
      const res = await jsonp({action:'set', id, v: v ? 1 : 0, n: r ? r.n : '', a: r ? r.a : ''});
      if (!res || !res.ok) throw new Error(res && res.error || 'error');
      if (pend[id] === v) delete pend[id];
      servidor = new Set(res.validados); persistir();
    }
    estado('ok');
  } catch(e) { estado('off'); }
  enviando = false; recalcular(); render();
}

async function sincronizar(){
  if (!ONLINE || enviando) return;
  if (Object.keys(pend).length) return enviar();
  try {
    const res = await jsonp({action:'list'});
    if (!res || !res.ok) throw new Error('error');
    if (enviando || Object.keys(pend).length) return;
    servidor = new Set(res.validados); persistir(); recalcular(); render(); estado('ok');
  } catch(e) { estado('off'); }
}

function cambiar(id, v){
  pend[id] = v; persistir(); recalcular(); render();
  ONLINE ? enviar() : (servidor = new Set(validados), pend = {}, persistir());
}

let modo = 'todos', filtro = '', actual = null;

const registros = DATA.map(r => ({...r, txt: norm(r.n + ' ' + r.a + ' ' + r.a + ' ' + r.n), letra: normLetra(r.a)}))
  .sort((x,y) => x.a.localeCompare(y.a,'es',{sensitivity:'base'}) || x.n.localeCompare(y.n,'es',{sensitivity:'base'}));

const $ = id => document.getElementById(id);
const ABC = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
$('letras').innerHTML = ABC.map(l => `<button data-l="${l}">${l}</button>`).join('');

function visibles(){
  const q = norm(filtro.trim());
  return registros.filter(r => (modo === 'todos' || (modo === 'val') === validados.has(r.id)) && (!q || r.txt.includes(q)));
}

function render(){
  const v = visibles();
  $('lista').innerHTML = v.length ? v.map(r => {
    const ok = validados.has(r.id);
    return `<button class="reg${ok?' val':''}" data-id="${r.id}" data-l="${r.letra}">
      <span><span class="ap">${r.a}</span>, ${r.n}${r.d?`<span class="det">${r.d}</span>`:''}</span>
      <span class="chk">✔</span></button>`;
  }).join('') : `<div class="vacio">${filtro ? 'Sin coincidencias' : modo === 'pend' ? '¡Todos los registros están validados! 🎉' : modo === 'val' ? 'Aún no hay registros validados' : 'Sin registros'}</div>`;

  const presentes = new Set(v.map(r => r.letra));
  document.querySelectorAll('#letras button').forEach(b => b.disabled = !presentes.has(b.dataset.l));

  const total = registros.length, nv = registros.filter(r => validados.has(r.id)).length, np = total - nv;
  const pct = n => total ? (n/total*100).toLocaleString('es-CL',{maximumFractionDigits:1}) + '%' : '0%';
  $('total').textContent = fmt(total);
  $('relleno').style.width = (total ? nv/total*100 : 0) + '%';
  $('nVal').textContent = fmt(nv); $('pVal').textContent = pct(nv);
  $('cTodos').textContent = fmt(total); $('cPend').textContent = fmt(np); $('cVal').textContent = fmt(nv);
  $('nPend').textContent = fmt(np); $('pPend').textContent = pct(np);
}

$('filtros').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  modo = b.dataset.m;
  document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('on', x === b));
  render();
};

// Lleva el buscador al borde superior de la pantalla
const subirBuscador = () => window.scrollTo({top: $('ancla').getBoundingClientRect().top + window.scrollY, behavior: 'auto'});
$('q').addEventListener('focus', () => { subirBuscador(); setTimeout(subirBuscador, 350); });
$('q').addEventListener('input', e => { filtro = e.target.value; $('limpiar').style.display = filtro ? 'block' : 'none'; render(); subirBuscador(); });
$('limpiar').onclick = () => { $('q').value = ''; filtro = ''; $('limpiar').style.display = 'none'; render(); };

$('letras').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const el = document.querySelector(`.reg[data-l="${b.dataset.l}"]`); if (!el) return;
  const off = $('sticky').getBoundingClientRect().height + 8;
  window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - off, behavior:'smooth'});
};

$('lista').onclick = e => {
  const b = e.target.closest('.reg'); if (!b) return;
  actual = registros.find(r => r.id === b.dataset.id);
  const yaVal = validados.has(actual.id);
  $('mNombre').textContent = actual.n + ' ' + actual.a;
  $('btnOk').textContent = yaVal ? 'Regresar a no validado' : 'OK';
  $('btnOk').classList.toggle('largo', yaVal);
  $('fondo').classList.add('on');
};
const cerrar = () => { $('fondo').classList.remove('on'); actual = null; };
$('btnX').onclick = cerrar;
$('fondo').onclick = e => { if (e.target === $('fondo')) cerrar(); };
$('btnOk').onclick = () => {
  const r = actual; cerrar();
  if (r) cambiar(r.id, !validados.has(r.id));
};

render();
estado(ONLINE ? 'wait' : 'ok');
if (ONLINE) {
  sincronizar();
  setInterval(sincronizar, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
  window.addEventListener('online', sincronizar);
}
</script>
</body>
</html>
